[tool.poetry]
name = "kmsr"
version = "0.1.8"
description = "kMSR provides a selection of algorithms to solve the k-Min-Sum-Radii problem."
authors = [
    "Niklas Lenssen <niklas.lenssen@hhu.de>",
    "Annika Hennes <annika.hennes@hhu.de>",
    "Melanie Schmidt <mschmidt@hhu.de>",
    "Giulia Baldini <giulia.baldini@hhu.de>"
]
readme = "README.md"
license = "GPL-3.0-only"
packages = [
    { include = "kmsr" }
]
include = ["images"]

classifiers = [
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: Implementation :: CPython",
]

[tool.poetry.urls]
Homepage = "https://clustering-toolkit.algo.hhu.de/K-Min_Sum_Radii_Clustering"
Repository = "https://github.com/algo-hhu/k-min-sum-radii"

[tool.poetry.dependencies]
python = "^3.12"
scikit-learn = "^1.9.1"

[tool.poetry.group.dev.dependencies]
black = "^26.10.1"
pre-commit = "^4.7.0"
flake8 = "^7.5.0"
mypy = "^2.4.1"
matplotlib = "^3.11.2"
pandas = "^3.1.0"

[tool.poetry.build]
script = "build_extension.py"
generate-setup-file = true

[build-system]
requires = ["poetry-core", "setuptools"]
build-backend = "poetry.core.masonry.api"

[virtualenvs]
create = true
in-project = true

[tool.isort]
profile = "black"
line_length = 88
